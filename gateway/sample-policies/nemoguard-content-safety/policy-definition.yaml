name: nemoguard-content-safety
version: v1.0.0
displayName: NeMo Guard Content Safety
description: |
  Validates request and/or response content using NVIDIA NeMo Guard 8B
  Content Safety. Request bodies are checked before they reach the upstream
  LLM; response bodies are checked before they are delivered to the client.
  Unsafe requests are rejected with a configurable status code; unsafe
  responses are replaced with a sanitised error message.

  NeMo Guard classifies content into nine safety categories:
    S1 Violence, S2 Sexual content, S3 Criminal planning,
    S4 Guns/Weapons, S5 Regulated substances, S6 Suicide/Self-harm,
    S7 Hate/Discriminatory, S8 Terrorism, S9 Weapons of mass destruction.

parameters:
  type: object
  properties:
    request:
      type: object
      x-wso2-policy-advanced-param: false
      description: Configuration for request-phase content safety checks.
      properties:
        enabled:
          type: boolean
          x-wso2-policy-advanced-param: false
          description: |
            Enables content safety checks on incoming requests.
          default: true
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression used to extract the user message from the
            request body. Applies to JSON payloads only; non-JSON bodies are
            passed through unchanged.
          default: "$.messages[-1].content"
        blockStatusCode:
          type: integer
          x-wso2-policy-advanced-param: false
          description: |
            HTTP status code returned when a request is blocked.
          default: 400
          minimum: 400
          maximum: 599
        categories:
          type: object
          x-wso2-policy-advanced-param: false
          description: |
            Toggle individual safety categories. Each enabled category
            (true) will block the request when detected. Disabled categories
            (false) are passed through even if NeMo Guard flags them.
            All categories are blocked by default when this object is omitted.
          properties:
            violence:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S1 — Block violent content."
              default: true
            sexual_content:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S2 — Block sexual content."
              default: true
            criminal_planning:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S3 — Block criminal planning content."
              default: true
            guns_weapons:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S4 — Block guns and weapons content."
              default: true
            regulated_substances:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S5 — Block regulated substances content."
              default: true
            suicide_self_harm:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S6 — Block suicide and self-harm content."
              default: true
            hate_discriminatory:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S7 — Block hate and discriminatory content."
              default: true
            terrorism:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S8 — Block terrorism-related content."
              default: true
            weapons_of_mass_destruction:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S9 — Block weapons of mass destruction content."
              default: true
        passthroughOnError:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            When true, allows the request to proceed if the NeMo Guard API
            call fails (fail-open). When false (default), a 503 is returned
            on API errors (fail-closed).
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            When true, includes the detected safety category in the
            blocked-request error response body.
          default: false
    response:
      type: object
      x-wso2-policy-advanced-param: false
      description: Configuration for response-phase content safety checks.
      properties:
        enabled:
          type: boolean
          x-wso2-policy-advanced-param: false
          description: |
            Enables content safety checks on upstream responses before they
            are delivered to the client.
          default: false
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression used to extract the assistant reply from the
            response body.
          default: "$.choices[0].message.content"
        categories:
          type: object
          x-wso2-policy-advanced-param: false
          description: |
            Toggle individual safety categories for response-phase checks.
            Same semantics as the request-phase categories object.
          properties:
            violence:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S1 — Block violent content."
              default: true
            sexual_content:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S2 — Block sexual content."
              default: true
            criminal_planning:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S3 — Block criminal planning content."
              default: true
            guns_weapons:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S4 — Block guns and weapons content."
              default: true
            regulated_substances:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S5 — Block regulated substances content."
              default: true
            suicide_self_harm:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S6 — Block suicide and self-harm content."
              default: true
            hate_discriminatory:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S7 — Block hate and discriminatory content."
              default: true
            terrorism:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S8 — Block terrorism-related content."
              default: true
            weapons_of_mass_destruction:
              type: boolean
              x-wso2-policy-advanced-param: false
              description: "S9 — Block weapons of mass destruction content."
              default: true
        passthroughOnError:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            When true, allows the response to proceed if the NeMo Guard API
            call fails (fail-open). When false (default), a 503 is returned
            on API errors (fail-closed).
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            When true, includes the detected safety category in the
            replaced-response error body.
          default: false
  anyOf:
    - required: [request]
    - required: [response]

systemParameters:
  type: object
  additionalProperties: false
  properties:
    endpoint:
      type: string
      format: uri
      description: |
        Base URL of the OpenAI-compatible inference endpoint serving the
        NeMo Guard content safety model
        (e.g., http://nemoguard:8000). The policy appends
        /v1/chat/completions automatically.
      minLength: 1
      "wso2/defaultValue": "${config.nemoguard_endpoint}"
    apiKey:
      type: string
      description: |
        Bearer token used to authenticate with the inference endpoint.
        Leave empty if the endpoint does not require authentication.
      "wso2/defaultValue": "${config.nemoguard_api_key}"
    model:
      type: string
      description: |
        Model identifier forwarded in the API request. Override only when
        the serving endpoint uses a different name for the model.
      default: "meta-llama/Llama-Guard-3-8B"
      "wso2/defaultValue": "${config.nemoguard_model}"
    timeout:
      type: integer
      description: |
        Per-request timeout in seconds for calls to the NeMo Guard endpoint.
      default: 10
      minimum: 1
      maximum: 60
      "wso2/defaultValue": "${config.nemoguard_timeout}"
  required:
    - endpoint
