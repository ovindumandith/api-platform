
# AI Guardrail model endpoints (RunPod Direct TCP)
granite_guardian_endpoint = "http://63.141.33.41:22198"
granite_guardian_api_key  = ""
granite_guardian_model    = "ibm-granite/granite-guardian-3.3-8b"
granite_guardian_timeout  = 30

nemoguard_endpoint = "http://63.141.33.41:22197"
nemoguard_api_key  = ""
nemoguard_model    = "meta-llama/Llama-Guard-3-8B"
nemoguard_timeout  = 30

[analytics]
enabled = true
allow_payloads = false
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = "<MOESIF_APPLICATION_ID>"

[router]
gateway_host = "*"

[router.access_logs]
enabled = true

[controller.server]
gateway_id = "platform-gateway-id"

[controller.controlplane]
insecure_skip_verify = true

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = "admin"
roles = ["admin"]

[policy_configurations.llm_cost_v1]
pricing_file = "/etc/policy-engine/llm-pricing/model_prices.json"

[immutable_gateway]
enabled = false
artifacts_dir = "/etc/api-platform-gateway/immutable_gateway/artifacts"
