
[analytics]
enabled = true
allow_payloads = false
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = "<MOESIF_APPLICATION_ID>"

[router]
gateway_host = "*"

[router.access_logs]
enabled = true

[controller.server]
gateway_id = "platform-gateway-id"

[controller.controlplane]
insecure_skip_verify = true

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = "admin"
roles = ["admin"]

[policy_configurations.llm_cost_v1]
pricing_file = "/etc/policy-engine/llm-pricing/model_prices.json"

[immutable_gateway]
enabled = false
artifacts_dir = "/etc/api-platform-gateway/immutable_gateway/artifacts"

# --------------------------------------------------------------------
# AI Guardrail model endpoints (RunPod via SSH tunnel)
#
# SSH tunnel setup on your laptop (run each in a separate terminal):
#   ssh -L 8100:localhost:8100 -N root@<runpod-ip> -p <ssh-port>   # Granite Guardian
#   ssh -L 8101:localhost:8101 -N root@<runpod-ip> -p <ssh-port>   # NeMo Guard
#
# The policy engine runs inside the gateway-runtime container, so it
# reaches your laptop's tunneled ports via host.docker.internal.
# --------------------------------------------------------------------

[granite_guardian]
endpoint = "http://host.docker.internal:8100"
api_key  = ""
model    = "ibm-granite/granite-guardian-3.3-8b"
timeout  = 30

[nemoguard]
endpoint = "http://host.docker.internal:8101"
api_key  = ""
model    = "nvidia/llama-3.1-nemoguard-8b-content-safety"
timeout  = 30
